spring.application.name=inventario-activos

# Configuración del Puerto de la Aplicación
server.port=8081

# Configuración de Conexión a Oracle DB
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=INVENTARIO_USER
spring.datasource.password=inventario_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Formato JSON global para fechas ISO
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC